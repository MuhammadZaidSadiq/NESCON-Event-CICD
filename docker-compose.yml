services:
  db:
    image: mysql:8.0
    container_name: nescon-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: nescon_db
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
  backend:
    build: .
    container_name: nescon-backend
    restart: always
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpass
      DB_NAME: nescon_db
    depends_on:
      - db
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nescon-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  db_data:

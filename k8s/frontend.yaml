apiVersion: apps/v1
kind: Deployment
metadata:
  name: nescon-frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: nescon-frontend}
  template:
    metadata:
      labels: {app: nescon-frontend}
    spec:
      containers:
      - name: frontend
        image: nescon-frontend:latest
        imagePullPolicy: Never
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: nescon-frontend
spec:
  type: NodePort
  selector: {app: nescon-frontend}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
